version: '3.8'

services:
  # Server API principal
  api:
    build: .
    container_name: cloud-api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/cloudstorage
      - JWT_SECRET=your_jwt_secret_key_here
      - NUM_STORAGE_CONTAINERS=20
      - CONTAINER_PREFIX=storage-
      - CONTAINER_PORT=3000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  # Bază de date PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: cloud-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cloudstorage
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped

  # Frontend Angular
  frontend:
    build: ../frontend
    container_name: cloud-frontend
    ports:
      - "4200:80"
    networks:
      - app-network
    restart: unless-stopped

  # Containere de stocare pentru fragmentele de fișiere
  storage-1:
    build: ./storage-container
    container_name: storage-1
    environment:
      - CONTAINER_ID=1
      - PORT=3000
    volumes:
      - storage-data-1:/app/storage
    networks:
      - app-network
    restart: unless-stopped

  storage-2:
    build: ./storage-container
    container_name: storage-2
    environment:
      - CONTAINER_ID=2
      - PORT=3000
    volumes:
      - storage-data-2:/app/storage
