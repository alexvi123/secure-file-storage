<!-- src/app/pages/auth/two-factor/two-factor.component.html -->
<div class="two-factor-container">
    <div class="two-factor-card">
      <h2>Verificare în doi pași</h2>
      <p class="info-text">Introduceți codul din aplicația de autentificare.</p>
      
      <!-- Mesaj de eroare -->
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>
      
      <form [formGroup]="twoFactorForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="code">Cod de verificare</label>
          <input 
            type="text" 
            id="code" 
            formControlName="code" 
            class="form-control code-input" 
            [ngClass]="{ 'is-invalid': submitted && f['code'].errors }"
            maxlength="6"
            autocomplete="one-time-code"
            (keydown)="onKeyDown($event)"
            placeholder="123456"
            autofocus
          />
          <div *ngIf="submitted && f['code'].errors" class="invalid-feedback">
            <div *ngIf="f['code'].errors['required']">Codul de verificare este obligatoriu</div>
            <div *ngIf="f['code'].errors['pattern']">Codul trebuie să conțină 6 cifre</div>
          </div>
        </div>
        
        <div class="form-group">
          <button [disabled]="loading" class="btn btn-primary btn-block">
            <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
            Verifică
          </button>
        </div>
        
        <div class="text-center mt-3">
          <a routerLink="/auth/login">Înapoi la autentificare</a>
        </div>
      </form>
    </div>
  </div>
