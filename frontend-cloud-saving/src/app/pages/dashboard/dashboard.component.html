<!-- src/app/pages/dashboard/dashboard.component.html -->
<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="logo">Cloud Storage</div>
    
    <div class="user-menu">
      <span *ngIf="currentUser" class="welcome-message">
        Bine ai venit, {{ currentUser.name }} {{ currentUser.surname }}
      </span>
      <button class="btn btn-outline" (click)="logout()">
        Deconectare
      </button>
    </div>
  </header>
  
  <div class="dashboard-content">
    <div class="sidebar">
      <nav class="sidebar-menu">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-item">
          <i class="fa fa-dashboard"></i> Dashboard
        </a>
        <a routerLink="/dashboard/files" routerLinkActive="active" class="menu-item">
          <i class="fa fa-file"></i> Fișierele mele
        </a>
        <a routerLink="/dashboard/upload" routerLinkActive="active" class="menu-item">
          <i class="fa fa-upload"></i> Încarcă fișiere
        </a>
        <a routerLink="/dashboard/profile" routerLinkActive="active" class="menu-item">
          <i class="fa fa-user"></i> Profil
        </a>
      </nav>
    </div>
    
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
